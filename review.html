<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leave a Review | The Cozy Table</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <header>
    <nav class="arc-navbar">
      <a href="index.html#home" class="arc-brand">
        <span class="arc-brand-icon"><i data-lucide="utensils-crossed" style="width: 16px; height: 16px;"></i></span>
        <span>The Cozy Table</span>
      </a>
      <ul class="arc-nav-links">
        <li><a href="index.html#home" class="arc-nav-link">Home</a></li>
        <li><a href="index.html#reviews" class="arc-nav-link">Testimonials</a></li>
        <li><a href="review.html" class="arc-nav-link active">Write Review</a></li>
      </ul>
    </nav>
  </header>

  <main class="container" style="display: flex; justify-content: center; align-items: center; min-height: 85vh; padding-top: 5ref; padding-top: 5rem;">
    <div class="editorial-form" style="max-width: 540px; width: 100%; background: var(--bg-card); padding: 2.5rem; border-radius: 12px; border: 1px solid var(--border-subtle);">
      <div class="section-header" style="text-align: left; margin-bottom: 1.5rem;">
        <span class="editorial-tag">Table Testimonials</span>
        <h2>Share Your Experience</h2>
        <p>Tell us about your meal, the ambiance, or your favorite West African dish.</p>
      </div>

      <form id="reviewForm" style="display: flex; flex-direction: column; gap: 1.2rem;">
        <div class="input-block">
          <label for="revname">Your Name</label>
          <input type="text" id="revname" class="editorial-input" placeholder="Enter your name" required>
        </div>
        <div class="input-block">
          <label for="rating">Rating (1 to 5 Stars)</label>
          <select id="rating" class="editorial-input" required>
            <option value="5">★★★★★ - Pure Comfort on a Plate</option>
            <option value="4">★★★★☆ - Wonderful Experience</option>
            <option value="3">★★★☆☆ - Good</option>
            <option value="2">★★☆☆☆ - Fair</option>
            <option value="1">★☆☆☆☆ - Needs Improvement</option>
          </select>
        </div>
        <div class="input-block">
          <label for="reviewtext">Your Review</label>
          <textarea id="reviewtext" class="editorial-input" placeholder="Describe your dining experience or favorite dish..." style="min-height: 120px;" required></textarea>
        </div>
        <button type="submit" class="arc-btn arc-btn-primary" style="width: 100%; justify-content: center;">Submit Review &rarr;</button>
      </form>
    </div>
  </main>

  <footer class="editorial-footer">
    <div class="container footer-content">
      <p style="font-size: 0.85rem; color: var(--text-muted); text-align: center; margin: 0;">&copy; 2026 The Cozy Table. Handcrafted with care &amp; warmth.</p>
    </div>
  </footer>

  <script src="script.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
